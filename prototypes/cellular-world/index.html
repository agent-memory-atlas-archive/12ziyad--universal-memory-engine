<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cellular World — Interactive Prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; overflow:hidden; font-family:Inter,system-ui,sans-serif; background:#071018; color:#eaf2f7; }
  #app { position:fixed; inset:0; }
  canvas { width:100%; height:100%; display:block; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  #top {
    position:fixed; left:16px; right:16px; top:16px;
    display:flex; gap:10px; align-items:center; pointer-events:none;
  }
  .panel {
    background:rgba(7,15,22,.88); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; box-shadow:0 10px 35px rgba(0,0,0,.3);
    backdrop-filter:blur(12px);
  }
  #title { padding:11px 14px; font-weight:800; letter-spacing:.2px; }
  #status { margin-left:auto; padding:9px 12px; font-size:12px; color:#a9bdc9; }
  #controls {
    position:fixed; left:16px; bottom:16px; width:min(620px,calc(100vw - 32px));
    padding:12px; display:flex; gap:8px; align-items:center;
  }
  input {
    flex:1; min-width:0; border:1px solid rgba(255,255,255,.14);
    background:#0d1b25; color:#eef7fb; padding:12px 13px; border-radius:10px; outline:none;
  }
  input:focus { border-color:#6fd6ff; }
  button {
    border:0; border-radius:10px; padding:11px 14px; color:#061019;
    background:#78d8ff; font-weight:800; cursor:pointer;
  }
  button:hover { filter:brightness(1.08); }
  #info {
    position:fixed; right:16px; top:70px; width:250px; padding:14px;
    display:none; line-height:1.45; font-size:13px;
  }
  #info b { color:#fff; }
  #hint {
    position:fixed; right:16px; bottom:16px; padding:10px 12px;
    font-size:12px; color:#9fb4bf;
  }
  .pill { display:inline-block; margin-top:7px; padding:3px 7px; border-radius:999px; background:#102d38; color:#86dcff; }
</style>
</head>
<body>
<div id="app"><canvas id="world"></canvas></div>
<div id="top">
  <div id="title" class="panel">🧱 Cellular World <span style="color:#73d9ff">LIVE</span></div>
  <div id="status" class="panel">60 FPS simulation • 64×64 cells</div>
</div>
<div id="info" class="panel"></div>
<div id="controls" class="panel">
  <input id="command" placeholder='Try: "make the deer run to the house" or "move the deer to the river"'/>
  <button id="go">Run</button>
</div>
<div id="hint" class="panel">Drag = pan • Wheel = zoom • Click = inspect • No animation frames — cells update continuously</div>

<script>
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const command = document.getElementById("command");
const go = document.getElementById("go");

const W = 64, H = 64;
let dpr = Math.min(devicePixelRatio || 1, 2);
let view = { x: 0, y: 0, scale: 12 };
let dragging = false, last = {x:0,y:0};
let selected = null;

const world = {
  cells: new Float32Array(W*H),
  objects: [
    {id:"deer", type:"deer", name:"Deer", x:18, y:28, color:"#d88935", height:1.7,
      target:null, speed:7},
    {id:"house", type:"house", name:"House", x:48, y:39, color:"#9b623f", height:2.3},
  ],
  trees: [
    [10,12],[17,16],[27,10],[36,15],[55,13],[58,27],[8,42],[20,48],
    [33,45],[43,51],[54,47],[60,56],[28,57]
  ],
  riverX: 38
};

function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize); resize();

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function screenToWorld(sx,sy){
  return {x:(sx-innerWidth/2-view.x)/view.scale+W/2,
          y:(sy-innerHeight/2-view.y)/view.scale+H/2};
}
function worldToScreen(x,y){
  return {x:(x-W/2)*view.scale+innerWidth/2+view.x,
          y:(y-H/2)*view.scale+innerHeight/2+view.y};
}

function terrainHeight(x,y){
  const r = Math.hypot(x-30,y-31);
  let h = 0.15 + 0.08*Math.sin(x*.45)*Math.sin(y*.37);
  if (Math.abs(x-world.riverX-4*Math.sin(y*.13)) < 2.2) h = 0.03;
  if (r < 12) h += (1-r/12)*.6;
  return Math.max(.02,h);
}

function roundedRect(x,y,w,h,r){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
}

function drawCell(wx,wy,h,color){
  const s = view.scale, p = worldToScreen(wx,wy);
  const lift = h*s*.45;
  const z = p.y-lift;
  ctx.fillStyle=color;
  ctx.fillRect(p.x-s*.48,z-s*.48,s*.96,s*.96);
  // subtle top highlight creates "raised cell" perception
  ctx.fillStyle="rgba(255,255,255,.08)";
  ctx.fillRect(p.x-s*.48,z-s*.48,s*.96,s*.16);
}

function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const grad=ctx.createLinearGradient(0,0,0,innerHeight);
  grad.addColorStop(0,"#091822"); grad.addColorStop(1,"#071018");
  ctx.fillStyle=grad; ctx.fillRect(0,0,innerWidth,innerHeight);

  // Ground cells
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    let h=terrainHeight(x,y);
    let col="#173b27";
    const riverDist=Math.abs(x-world.riverX-4*Math.sin(y*.13));
    if(riverDist<2.2) col = riverDist<1 ? "#1679a1" : "#1b6681";
    else if((x+y)%11===0) col="#1d482d";
    drawCell(x,y,h,col);
  }

  // Trees as clustered raised cells
  for(const [tx,ty] of world.trees){
    for(let oy=-2;oy<=2;oy++) for(let ox=-2;ox<=2;ox++){
      const d=Math.hypot(ox,oy);
      if(d<=2.2){
        const h=2.0 + (2.2-d)*.45;
        drawCell(tx+ox*.72,ty+oy*.72,h, d<1.1 ? "#2f7d38":"#235d31");
      }
    }
    drawCell(tx,ty,1.25,"#6a4529");
  }

  // House
  const house=world.objects.find(o=>o.id==="house");
  for(let oy=-2;oy<=2;oy++) for(let ox=-3;ox<=3;ox++){
    drawCell(house.x+ox*.7,house.y+oy*.7,2.0, "#8d5537");
  }
  drawCell(house.x,house.y-2.3,3.1,"#b54838");

  // Deer — continuous position, not frames
  const deer=world.objects.find(o=>o.id==="deer");
  if(deer.target){
    const dx=deer.target.x-deer.x, dy=deer.target.y-deer.y;
    const dist=Math.hypot(dx,dy);
    if(dist<.05){ deer.target=null; }
    else {
      const step=Math.min(dist,deer.speed*dt);
      deer.x += dx/dist*step; deer.y += dy/dist*step;
    }
  }
  // Deer body cells
  const bob = Math.sin(performance.now()*.012)*.08;
  const parts=[
    [0,0,2.5],[1.1,-.1,2.2],[-1.1,.1,2.2],[0,-1.0,3.1],[1.4,-1.0,3.0]
  ];
  for(const [ox,oy,h] of parts) drawCell(deer.x+ox*.7,deer.y+oy*.7,h+bob,deer.color);
  drawCell(deer.x+1.6,deer.y-1.2,3.2,deer.color);

  // Selection outline
  if(selected){
    const p=worldToScreen(selected.x,selected.y);
    ctx.strokeStyle="#8de5ff"; ctx.lineWidth=2;
    ctx.strokeRect(p.x-view.scale*2.2,p.y-view.scale*2.2,view.scale*4.4,view.scale*4.4);
  }

  requestAnimationFrame(draw);
}
let lastT=performance.now(), dt=0;
function loopTime(t){ dt=Math.min(.05,(t-lastT)/1000); lastT=t; requestAnimationFrame(loopTime); }
requestAnimationFrame(loopTime);
requestAnimationFrame(draw);

canvas.addEventListener("pointerdown",e=>{
  dragging=true; canvas.classList.add("dragging"); last={x:e.clientX,y:e.clientY};
});
addEventListener("pointerup",()=>{dragging=false;canvas.classList.remove("dragging");});
addEventListener("pointermove",e=>{
  if(!dragging)return;
  view.x+=e.clientX-last.x; view.y+=e.clientY-last.y;
  last={x:e.clientX,y:e.clientY};
});
canvas.addEventListener("click",e=>{
  if(Math.abs(e.clientX-last.x)>4)return;
  const w=screenToWorld(e.clientX,e.clientY);
  let nearest=null,best=3;
  for(const o of world.objects){
    const d=Math.hypot(o.x-w.x,o.y-w.y);
    if(d<best){best=d;nearest=o;}
  }
  selected=nearest;
  if(nearest){
    info.style.display="block";
    info.innerHTML=`<b>Selected: ${nearest.name}</b><br>Type: ${nearest.type}<br>Position: ${nearest.x.toFixed(1)}, ${nearest.y.toFixed(1)}<br>Height: ${nearest.height}<br><span class="pill">${nearest.target?"moving":"idle"}</span>`;
  }else info.style.display="none";
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const before=screenToWorld(e.clientX,e.clientY);
  view.scale=clamp(view.scale*Math.exp(-e.deltaY*.001),5,28);
  const after=screenToWorld(e.clientX,e.clientY);
  view.x+=(after.x-before.x)*view.scale;
  view.y+=(after.y-before.y)*view.scale;
},{passive:false});

function targetFor(text){
  const deer=world.objects.find(o=>o.id==="deer");
  const house=world.objects.find(o=>o.id==="house");
  const t=text.toLowerCase();
  let target=null, action="walk";
  if(t.includes("house")) target={x:house.x,y:house.y};
  else if(t.includes("river") || t.includes("water")) target={x:world.riverX+1,y:32};
  else if(t.includes("left")) target={x:8,y:deer.y};
  else if(t.includes("right")) target={x:56,y:deer.y};
  else {
    const m=t.match(/(?:to|toward|towards)\\s+(\\d+)\\s*[, ]\\s*(\\d+)/);
    if(m) target={x:+m[1],y:+m[2]};
  }
  if(t.includes("run")) { action="run"; deer.speed=16; }
  else { deer.speed=7; }
  if(t.includes("stop")) { deer.target=null; return "Stopped the deer."; }
  if(target){ deer.target=target; return `${action==="run"?"Running":"Walking"} the deer to (${target.x}, ${target.y}).`; }
  return 'Try "make the deer run to the house", "move the deer to the river", or "stop the deer".';
}
go.onclick=()=>{ status(targetFor(command.value)); };
command.addEventListener("keydown",e=>{if(e.key==="Enter"){status(targetFor(command.value));}});
function status(msg){
  document.getElementById("status").textContent=msg;
  setTimeout(()=>document.getElementById("status").textContent="60 FPS simulation • 64×64 cells",3500);
}
</script>
</body>
</html>
